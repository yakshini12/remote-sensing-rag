# Stage 2 only: frozen CLIP embeddings and UCM -> RSITMD retrieval.
# KARG-RSIC specifies CLIP ViT-B/32 pretrained on LAION-400M, but does not
# publish an exact checkpoint identifier. R0 therefore records the explicit
# reproducible interpretation below; it is not claimed to be author code.

experiment:
  id: R0_clip_exact
  seed: 42

paths:
  ucm_manifest: data/processed/real_ucm_rsitmd/ucm_captions_manifest.jsonl
  rsitmd_manifest: data/processed/real_ucm_rsitmd/rsitmd_manifest.jsonl
  leakage_audit: reports/real_ucm_rsitmd/leakage_audit.json
  artifact_root: artifacts/stage2/R0_clip_exact

clip:
  library: open_clip
  model_name: ViT-B-32-quickgelu
  pretrained: laion400m_e32
  expected_embedding_dimension: 512
  normalization: l2
  device: auto
  image_batch_size: 64
  text_batch_size: 256
  num_workers: 0

retrieval:
  k_values: [1, 3, 5, 10]
  exact_query_batch_size: 128

hnsw:
  enabled: true
  space: ip
  m: 32
  ef_construction: 200
  ef_search: 100

qualitative:
  num_queries: 75
  thumbnail_size: 256

leakage:
  perceptual_hamming_threshold: 5
