[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsrag"
version = "0.1.0"
description = "Reproducible remote-sensing RAG research codebase (Stages 0-2: data audit and retrieval)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "ImageHash>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rsrag-audit = "rsrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
